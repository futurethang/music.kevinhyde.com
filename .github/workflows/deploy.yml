name: Deploy to GitHub Pages

# Requires a one-time repo setting:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is switched from "Deploy from a branch", the deploy step fails.

on:
  push:
    # The default branch. Both names are listed so a later rename to `main`
    # doesn't silently stop deploys.
    branches:
      - claude/music-site-kickoff-JDBzM
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
