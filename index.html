<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin Hyde Music</title>
  <meta name="description" content="Music by Kevin Hyde. Independent releases from Dismal Nitch, Seattle.">

  <!-- Open Graph -->
  <meta property="og:title" content="Kevin Hyde Music">
  <meta property="og:description" content="Independent music releases from Seattle.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://music.kevinhide.com">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="site-header">
      <h1>Kevin Hyde</h1>
    </header>

    <section class="tracks">
      <article class="track" id="floating-apart">
        <div class="track-artwork">
          <img src="artwork/floating-apart-placeholder.svg" alt="Floating Apart" class="artwork">
        </div>

        <div class="track-info">
          <h2 class="track-title">Floating Apart</h2>
          <p class="track-meta">2025 · 3:42</p>

          <div class="track-player">
            <audio controls preload="metadata" id="audio-floating-apart">
              <source src="audio/floating-apart.mp3" type="audio/mpeg">
              Your browser doesn't support audio playback.
            </audio>
          </div>

          <details class="track-details">
            <summary>About this song</summary>
            <p class="track-notes">
              <!-- Kevin will update this -->
              More details coming soon.
            </p>
            <p class="track-credits">
              Written, performed, and produced by Kevin Hyde<br>
              Recorded at Dismal Nitch, Seattle<br>
              December 2025
            </p>
          </details>
        </div>
      </article>
    </section>

    <!-- Future: More tracks will be added above this line, newest first -->

    <footer class="site-footer">
      <p class="copyright">© 2025 Kevin Hyde. All rights reserved.</p>
      <p class="contact">
        <a href="mailto:kphyde@gmail.com">Get in touch</a>
        <!-- Future: Add tip jar link here -->
      </p>
    </footer>
  </main>
</body>
</html>
